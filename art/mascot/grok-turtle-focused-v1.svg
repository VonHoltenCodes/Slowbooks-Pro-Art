<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 420 580" role="img" aria-labelledby="title desc">
  <title id="title">SlowBooks Pro turtle reading a ledger</title>
  <desc id="desc">A green turtle with a gold visor looks down at an open blank ledger held in both hands. Transparent background.</desc>
  <!-- Steady Ledger. Drawn by Grok. Credit: Grok. https://x.ai -->
<g id="turtle">

        <g id="legs">
          <line x1="172" y1="448" x2="164" y2="522" stroke="#3c8f34" stroke-width="34" stroke-linecap="round"/>
          <line x1="248" y1="448" x2="256" y2="522" stroke="#3c8f34" stroke-width="34" stroke-linecap="round"/>
          <ellipse cx="152" cy="530" rx="32" ry="14" fill="#1a5418"/>
          <ellipse cx="272" cy="530" rx="32" ry="14" fill="#1a5418"/>
        </g>

        <g id="shell">
          <ellipse cx="210" cy="332" rx="122" ry="138" fill="#1a5418"/>
          <ellipse cx="210" cy="328" rx="112" ry="128" fill="#257321"/>
          <path d="M210 214 V400" fill="none" stroke="#1a5418" stroke-width="3" stroke-linecap="round"/>
          <path d="M112 286 Q210 308 308 286" fill="none" stroke="#1a5418" stroke-width="3" stroke-linecap="round"/>
          <path d="M108 352 Q210 378 312 352" fill="none" stroke="#1a5418" stroke-width="3" stroke-linecap="round"/>
          <g id="shell-page">
            <rect x="192" y="228" width="36" height="44" rx="3" fill="#fbf7ef"/>
            <path d="M198 240 H222 M198 248 H222 M198 256 H214" stroke="#336699" stroke-width="1.5" stroke-linecap="round"/>
          </g>
        </g>

        <g id="plastron">
          <ellipse cx="210" cy="386" rx="70" ry="72" fill="#f4efe4"/>
        </g>

        <g id="head">
          <path d="M176 196 H244 V214 H176 Z" fill="#3c8f34"/>
          <ellipse cx="210" cy="158" rx="74" ry="64" fill="#3c8f34"/>
          <ellipse cx="210" cy="196" rx="22" ry="14" fill="#2c6d28"/>
          
        <g id="visor">
          <path fill="#cc9933" d="M132 132
            C160 112 250 112 278 132
            L274 146
            C246 132 164 132 136 146 Z"/>
          <path fill="#cc9933" d="M118 144
            C160 162 250 162 292 144
            L292 156
            C248 176 162 176 118 156 Z"/>
          <path fill="#a67b22" d="M124 154
            C164 170 246 170 286 154
            L286 160
            C246 176 164 176 124 160 Z"/>
          <circle cx="140" cy="136" r="3" fill="#002244"/>
          <circle cx="270" cy="136" r="3" fill="#002244"/>
        </g>
          
        <g id="brows" fill="none" stroke="#1a5418" stroke-width="4" stroke-linecap="round">
          <path d="M162 160 Q180 154 196 162"/>
          <path d="M214 162 Q230 154 248 160"/>
        </g>
          
        <g id="eyes">
          <ellipse cx="180" cy="176" rx="7.5" ry="4" fill="#002244"/>
          <ellipse cx="230" cy="176" rx="7.5" ry="4" fill="#002244"/>
          <circle cx="178" cy="175" r="1.6" fill="#fbf7ef"/>
          <circle cx="228" cy="175" r="1.6" fill="#fbf7ef"/>
        </g>
          <path id="mouth" d="M182 204 Q205 210 228 204" fill="none" stroke="#002244" stroke-width="4" stroke-linecap="round"/>
        </g>
<g id="arm-left"><line x1="124" y1="300" x2="150" y2="372" stroke="#3c8f34" stroke-width="30" stroke-linecap="round"/></g>
<g id="arm-right"><line x1="296" y1="300" x2="270" y2="372" stroke="#3c8f34" stroke-width="30" stroke-linecap="round"/></g>

        <g id="ledger" transform="translate(210,318) scale(1)">
          <path d="M0 6 L-78 0 L-78 92 L0 84 Z" fill="#fbf7ef" stroke="#003366" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M0 6 L78 0 L78 92 L0 84 Z" fill="#f4efe4" stroke="#003366" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M0 6 V84" stroke="#003366" stroke-width="3"/>
          <path d="M-64 20 H-16 M-64 32 H-16 M-64 44 H-16 M-64 56 H-22" stroke="#336699" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M16 20 H64 M16 32 H64 M16 44 H64 M16 56 H58" stroke="#336699" stroke-width="1.6" stroke-linecap="round"/>
        </g>
<g id="hands"><circle cx="148" cy="392" r="15" fill="#3c8f34"/><circle cx="272" cy="392" r="15" fill="#3c8f34"/></g>
</g>
</svg>
