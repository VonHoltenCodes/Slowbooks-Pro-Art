            C246 176 164 176 124 160 Z"/>
          <circle cx="140" cy="136" r="3" fill="#002244"/>
          <circle cx="270" cy="136" r="3" fill="#002244"/>
        </g>
          
          
        <g id="eyes">
          <circle cx="180" cy="174" r="7" fill="#002244"/>
          <circle cx="230" cy="174" r="7" fill="#002244"/>
          <circle cx="178" cy="172" r="2" fill="#fbf7ef"/>
          <circle cx="228" cy="172" r="2" fill="#fbf7ef"/>
        </g>
          <path id="mouth" d="M178 202 Q205 214 232 202" fill="none" stroke="#002244" stroke-width="4" stroke-linecap="round"/>
        </g>
<g id="arm-left"><line x1="128" y1="286" x2="108" y2="372" stroke="#3c8f34" stroke-width="30" stroke-linecap="round"/></g>

        <g id="ledger" transform="translate(156,292) rotate(-8)">
