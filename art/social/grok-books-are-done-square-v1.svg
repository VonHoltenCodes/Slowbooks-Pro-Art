          <rect x="0" y="0" width="11" height="98" rx="3" fill="#003366"/>
          <path d="M20 26 H62 M20 38 H62 M20 50 H62 M20 62 H54" stroke="#336699" stroke-width="1.6" stroke-linecap="round"/>
          
        </g>
<g id="arm-right"><line x1="292" y1="286" x2="248" y2="340" stroke="#3c8f34" stroke-width="30" stroke-linecap="round"/><circle cx="236" cy="352" r="15" fill="#3c8f34"/></g>
<circle cx="104" cy="386" r="15" fill="#3c8f34"/>
    </g>
    <text x="540" y="978" text-anchor="middle" fill="#003366" font-family="Inter, Liberation Sans, sans-serif"
