<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-labelledby="title desc">
  <title id="title">The books are done.</title>
  <desc id="desc">Square social post on cream. Navy words: The books are done. Under them: Free. Source-available. Yours to keep. A green turtle with a gold visor holds a blank ledger. The address slowbookspro.com is at the bottom in navy.</desc>
  <!-- Steady Ledger. Drawn by Grok. Credit: Grok. https://x.ai -->

    <rect width="1080" height="1080" fill="#f4efe4"/>
    <rect x="56" y="56" width="968" height="968" fill="none" stroke="#003366" stroke-width="3"/>
    <text x="540" y="168" text-anchor="middle" fill="#003366" font-family="Inter, Liberation Sans, sans-serif"
          font-weight="600" font-size="22" letter-spacing="6">SLOWBOOKS PRO</text>
    <text x="540" y="300" text-anchor="middle" fill="#003366" font-family="Inter, Liberation Sans, sans-serif"
          font-weight="700" font-size="88">The books</text>
    <text x="540" y="400" text-anchor="middle" fill="#003366" font-family="Inter, Liberation Sans, sans-serif"
          font-weight="700" font-size="88">are done.</text>
    <text x="540" y="468" text-anchor="middle" fill="#336699" font-family="Inter, Liberation Sans, sans-serif"
          font-weight="500" font-size="30">Free. Source-available. Yours to keep.</text>
    <g transform="translate(360,500) scale(0.78)">
      
        <g id="legs">
          <line x1="172" y1="448" x2="164" y2="522" stroke="#3c8f34" stroke-width="34" stroke-linecap="round"/>
          <line x1="248" y1="448" x2="256" y2="522" stroke="#3c8f34" stroke-width="34" stroke-linecap="round"/>
          <ellipse cx="152" cy="530" rx="32" ry="14" fill="#1a5418"/>
          <ellipse cx="272" cy="530" rx="32" ry="14" fill="#1a5418"/>
        </g>

        <g id="shell">
          <ellipse cx="210" cy="332" rx="122" ry="138" fill="#1a5418"/>
          <ellipse cx="210" cy="328" rx="112" ry="128" fill="#257321"/>
          <path d="M210 214 V400" fill="none" stroke="#1a5418" stroke-width="3" stroke-linecap="round"/>
          <path d="M112 286 Q210 308 308 286" fill="none" stroke="#1a5418" stroke-width="3" stroke-linecap="round"/>
          <path d="M108 352 Q210 378 312 352" fill="none" stroke="#1a5418" stroke-width="3" stroke-linecap="round"/>
          <g id="shell-page">
