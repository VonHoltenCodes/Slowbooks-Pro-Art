<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 900 680" width="900" height="680" role="img" aria-labelledby="title desc">
  <title id="title">Month's end, the turtle already finished</title>
  <desc id="desc">A green turtle with a gold visor stands behind a navy desk. A cup of coffee and an open blank ledger sit on the desk. Transparent background.</desc>
  <!-- Steady Ledger. Drawn by Grok. Credit: Grok. https://x.ai -->

      <g id="turtle" transform="translate(240,48) scale(0.86)">
        
        <g id="legs">
          <line x1="172" y1="448" x2="164" y2="522" stroke="#3c8f34" stroke-width="34" stroke-linecap="round"/>
          <line x1="248" y1="448" x2="256" y2="522" stroke="#3c8f34" stroke-width="34" stroke-linecap="round"/>
          <ellipse cx="152" cy="530" rx="32" ry="14" fill="#1a5418"/>
          <ellipse cx="272" cy="530" rx="32" ry="14" fill="#1a5418"/>
        </g>

        <g id="shell">
