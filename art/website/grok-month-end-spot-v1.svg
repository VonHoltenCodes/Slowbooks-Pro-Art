          <circle cx="178" cy="172" r="2" fill="#fbf7ef"/>
          <circle cx="228" cy="172" r="2" fill="#fbf7ef"/>
        </g>
          <path id="mouth" d="M178 202 Q208 214 236 196" fill="none" stroke="#002244" stroke-width="4" stroke-linecap="round"/>
        </g>
<g id="arm-left"><line x1="124" y1="286" x2="104" y2="378" stroke="#3c8f34" stroke-width="30" stroke-linecap="round"/><circle cx="100" cy="392" r="15" fill="#3c8f34"/></g>
<g id="arm-right"><line x1="296" y1="286" x2="316" y2="378" stroke="#3c8f34" stroke-width="30" stroke-linecap="round"/><circle cx="320" cy="392" r="15" fill="#3c8f34"/></g>
      </g>
      <g id="desk">
